<div class="container">
  <div class="form-card">
    <div class="form-header">
      <h1>Reactive Form Demo</h1>
      <p>Uses <code>[formGroup]</code> + <code>ngxFormDraft</code>. Fill in the form, refresh the page — your draft will be restored.</p>
    </div>

    <form [formGroup]="myForm" [ngxFormDraft]="'reactive_demo'" [draftDebounce]="500" [draftShowOnChange]="true" (ngSubmit)="onSubmit()">

      <fieldset>
        <legend>Personal Info</legend>
        <div class="form-row">
          <div class="field">
            <label for="rf-name">Full name</label>
            <input id="rf-name" type="text" formControlName="fullName" placeholder="Jane Doe" />
          </div>
          <div class="field">
            <label for="rf-age">Age</label>
            <input id="rf-age" type="number" formControlName="age" placeholder="30" />
          </div>
        </div>
        <div class="field">
          <label for="rf-email">Email</label>
          <input id="rf-email" type="email" formControlName="email" placeholder="jane@example.com" />
        </div>
        <div class="field">
          <label for="rf-bio">Bio</label>
          <textarea id="rf-bio" formControlName="bio" placeholder="Tell us about yourself…"></textarea>
        </div>
        <div class="field">
          <label for="rf-date">Birth date</label>
          <input id="rf-date" type="date" formControlName="birthDate" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferences</legend>
        <div class="form-row">
          <div class="field">
            <label for="rf-country">Country</label>
            <select id="rf-country" formControlName="country">
              <option *ngFor="let c of countries" [value]="c.value">{{ c.label }}</option>
            </select>
          </div>
          <div class="field">
            <label for="rf-tags">Frameworks <span class="hint">(hold Ctrl to multi-select)</span></label>
            <select id="rf-tags" formControlName="tags" multiple>
              <option value="angular">Angular</option>
              <option value="react">React</option>
              <option value="vue">Vue</option>
              <option value="svelte">Svelte</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="label-text">Gender</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" formControlName="gender" value="male" /><span>Male</span></label>
            <label class="radio-label"><input type="radio" formControlName="gender" value="female" /><span>Female</span></label>
            <label class="radio-label"><input type="radio" formControlName="gender" value="other" /><span>Other</span></label>
          </div>
        </div>
        <div class="field">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="newsletter" />
            <span>Subscribe to newsletter</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Items <span class="hint">(FormArray)</span></legend>
        <div formArrayName="items">
          <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="array-item">
            <div class="form-row">
              <div class="field">
                <label>Item name</label>
                <input type="text" formControlName="name" placeholder="Item {{ i + 1 }}" />
              </div>
              <div class="field field--sm">
                <label>Qty</label>
                <input type="number" formControlName="quantity" placeholder="1" />
              </div>
              <div class="field">
                <label>Notes</label>
                <input type="text" formControlName="notes" placeholder="Optional note" />
              </div>
            </div>
            <button type="button" class="btn-remove" (click)="removeItem(i)" [disabled]="items.length === 1">✕ Remove</button>
          </div>
        </div>
        <button type="button" class="btn-add" (click)="addItem()">+ Add item</button>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Submit form</button>
      </div>

    </form>
  </div>
</div>
