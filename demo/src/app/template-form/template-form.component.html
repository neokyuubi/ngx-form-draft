<div class="container">
  <div class="form-card">
    <div class="form-header">
      <h1>Template-driven Form Demo</h1>
      <p>Uses <code>ngForm</code> + <code>ngxFormDraft</code>. Fill in the form, refresh the page — your draft will be restored.</p>
    </div>

    <form #f="ngForm" [ngxFormDraft]="'template_demo'" [draftDebounce]="500" [draftShowOnChange]="true" (ngSubmit)="onSubmit()">

      <fieldset>
        <legend>Personal Info</legend>
        <div class="form-row">
          <div class="field">
            <label for="tf-name">Full name</label>
            <input id="tf-name" type="text" name="fullName" [(ngModel)]="model.fullName" placeholder="Jane Doe" />
          </div>
          <div class="field">
            <label for="tf-age">Age</label>
            <input id="tf-age" type="number" name="age" [(ngModel)]="model.age" placeholder="30" />
          </div>
        </div>
        <div class="field">
          <label for="tf-email">Email</label>
          <input id="tf-email" type="email" name="email" [(ngModel)]="model.email" placeholder="jane@example.com" />
        </div>
        <div class="field">
          <label for="tf-bio">Bio</label>
          <textarea id="tf-bio" name="bio" [(ngModel)]="model.bio" placeholder="Tell us about yourself…"></textarea>
        </div>
        <div class="field">
          <label for="tf-date">Birth date</label>
          <input id="tf-date" type="date" name="birthDate" [(ngModel)]="model.birthDate" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferences</legend>
        <div class="form-row">
          <div class="field">
            <label for="tf-country">Country</label>
            <select id="tf-country" name="country" [(ngModel)]="model.country">
              <option *ngFor="let c of countries" [value]="c.value">{{ c.label }}</option>
            </select>
          </div>
          <div class="field">
            <label for="tf-tags">Frameworks <span class="hint">(hold Ctrl to multi-select)</span></label>
            <select id="tf-tags" name="tags" [(ngModel)]="model.tags" multiple>
              <option value="angular">Angular</option>
              <option value="react">React</option>
              <option value="vue">Vue</option>
              <option value="svelte">Svelte</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="label-text">Gender</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="gender" value="male" [(ngModel)]="model.gender" /><span>Male</span></label>
            <label class="radio-label"><input type="radio" name="gender" value="female" [(ngModel)]="model.gender" /><span>Female</span></label>
            <label class="radio-label"><input type="radio" name="gender" value="other" [(ngModel)]="model.gender" /><span>Other</span></label>
          </div>
        </div>
        <div class="field">
          <label class="checkbox-label">
            <input type="checkbox" name="newsletter" [(ngModel)]="model.newsletter" />
            <span>Subscribe to newsletter</span>
          </label>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Submit form</button>
      </div>

    </form>
  </div>
</div>
